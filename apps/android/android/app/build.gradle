apply plugin: 'com.android.application'

// One version for the whole project: apps/android/package.json (kept in sync by scripts/release.mjs).
def minicordVersion = new groovy.json.JsonSlurper().parse(file("../../package.json")).version
def versionParts = minicordVersion.tokenize('-')[0].tokenize('.').collect { it as int }
def minicordVersionCode = versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]
// Release signing comes from the environment (GitHub Actions secrets, or a local keystore). Empty means unset.
def env = { String key -> def v = System.getenv(key); v ? v : null }
def releaseKeystore = env("MINICORD_KEYSTORE")
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "dev.minicord.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.minicord.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode minicordVersionCode
        versionName minicordVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    testOptions {
        unitTests.all {
            // Shared rules fixtures live in the TypeScript core so both implementations are held to the same cases.
            systemProperty "minicord.fixtures", file("../../../../packages/core/test/fixtures").absolutePath
        }
    }
    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword env("MINICORD_KEYSTORE_PASSWORD")
                keyAlias env("MINICORD_KEY_ALIAS") ?: "minicord"
                keyPassword env("MINICORD_KEY_PASSWORD") ?: env("MINICORD_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (releaseKeystore) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "com.squareup.okhttp3:okhttp:5.3.2"
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20260814"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

kotlin {
    jvmToolchain(21)
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
